<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/style.css">
  <title>Document</title>
</head>
<body style="font-family: Montserrat;">
  <div class="bg-main"></div>
  <main>
    <h1 class="main-title">Выбери свой продукт</h1>
    <button id="color-btn">поменять цвет кнопки</button>

    <div class="product-card-wrapper"></div>

    <template id="product-card-template">
      <section class="product-card">
        <img class="product-card__img" src="" alt="">
        <p class="product-card__skin-type"></p>
        <h3 class="product-card__name"></h3>
        <p class="product-card__descr"></p>
        <span>Состав:</span>
        <ul class="product-card__ingredients-list"></ul>
        <div class="product-card__price-wrapper">
          <span class="product-card__price-text">Цена</span>
          <span class="product-card__price"></span>
        </div>
      </section>
    </template>
    <script src="script.js"></script>
    <script src="homework-5.js"></script>
    <script src="homework-6.js"></script>
    <script type="module" src="homework-7.js"></script>
    <script type="module" src="homework-8.js"></script>
  </main>
  <footer class="shop-footer">
    <div class="footer-container">

      <div>
        <h2 class="footer-title">Product Cards</h2>
        <p class="footer-subtitle">У нас самые лучшие продукты для кожи!</p>
        <div class="footer-social">
          <img src="./icons/telegram-icon.svg" alt="Telegram" class="footer-social__icon">
          <img src="./icons/vk-icon.svg" alt="VK" class="footer-social__icon">
        </div>
      </div>

      <p class="footer-center-text">Подпишись на наши акции:</p>
      <div class="footer-subscribe-box">
          <span class="subscribe-placeholder">Введи Email...</span>
          <span class="subscribe-button">Подписаться</span>
      </div>

      <nav class="footer-nav">
        <a href="#" class="footer-nav__main">Быстрые ссылки</a>
        <div class="footer-nav__links">
          <a href="#" class="footer-link">Главная</a>
          <a href="#" class="footer-link">Магазин</a>
          <a href="#" class="footer-link">Контакты</a>
        </div>
      </nav>   
    </div>
    <p class="footer-site">www.product-cards.com©all right reserve</p>
  </footer>

</body>
</html>
